<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>TO-DO LIST APP</h1>
            <div class="stat-container">
                <div class="details">
                    <h3>Keep it Up!</h3>
                    <div id="progressbar">
                        <div id="progress"></div>
                    </div>
                </div>
                <div class="stat-number">
                    <p id="number">0/0</p>
                </div>
            </div>
            <form class="input-area">
                <input type="text" id="task-input" placeholder="Add a new task..." required>
                <button type="submit" id="add-task" aria-label="Add task">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
                </button>
            </form>
            <div class="todo-container">
                <ul id="task-list"></ul>
                <img class="empty-image" src="task-list-menu-document.svg" alt="No tasks image">
            </div>
        </div>
    </div>
    <canvas id="confetti-canvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
